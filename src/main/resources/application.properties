# ============================================================
# Offline Certificate Verification Using Blockchain
# application.properties - Day 1 Configuration
# ============================================================

# ----- Server -----
server.port=8080

# ----- Application Info -----
spring.application.name=certificate-verification

# ----- SQLite Database -----
spring.datasource.url=jdbc:sqlite:certificate_verification.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ----- JPA / Hibernate -----
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----- Thymeleaf -----
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ----- Logging -----
logging.level.com.certificateverification=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN

# ----- Actuator (optional health endpoint) -----
management.endpoints.web.exposure.include=health
